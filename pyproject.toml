[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vad-risk-assessment"
version = "0.1.0"
description = "Real-Time Video Anomaly Detection and Risk Assessment Using Deep Learning"
readme = "README.md"
requires-python = ">=3.11, <3.13"
license = { text = "MIT" }
authors = [
    { name = "VAD Research Team" }
]
keywords = [
    "deep-learning",
    "video-anomaly-detection",
    "weak-supervision",
    "multiple-instance-learning",
    "temporal-convolutional-networks",
    "risk-assessment"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Programming Language :: Python :: 3.11",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux"
]

dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "pillow>=9.5.0",
    "tqdm>=4.65.0",
    "rich>=13.4.0",
    "typing-extensions>=4.6.0",
    "filelock>=3.12.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "ruff>=0.0.280",
    "mypy>=1.4.0"
]
viz = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv", "refrence", "experiments", "outputs", "data"]

